name: Import pinned original assets
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-assets.yml'
      - 'assets/manifest.csv'
      - 'tools/download_assets.py'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify
        run: python3 tools/download_assets.py
      - name: Commit original archives
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/source
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "assets: add verified original OpenGameArt archives"
          git push origin HEAD:main
