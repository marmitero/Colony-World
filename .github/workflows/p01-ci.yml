name: Colony World foundation checks
on:
  push:
    paths: ["server/**", "client/world/**", "tools/launch.ps1", "jogar.bat", "shared/**", "migrations/**", "tests/**", ".github/workflows/p01-ci.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  server:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.6'
          cache: false
      - run: go test ./...
      - run: go vet ./...
      - run: go build -buildvcs=false ./cmd/colony
      - if: runner.os == 'Linux'
        run: python3 ../tests/check_bravamar.py
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens=$null
          $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path ../tools/launch.ps1),[ref]$tokens,[ref]$errors) > $null
          if ($errors.Count -ne 0) { $errors; exit 1 }
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: ci-only-fixture
          POSTGRES_DB: colony_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d colony_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      PGPASSWORD: ci-only-fixture
    steps:
      - uses: actions/checkout@v4
      - run: psql -h 127.0.0.1 -U test -d colony_test -v ON_ERROR_STOP=1 -f migrations/001_foundation.sql
      - run: psql -h 127.0.0.1 -U test -d colony_test -v ON_ERROR_STOP=1 -f migrations/001_foundation.sql
      - run: psql -h 127.0.0.1 -U test -d colony_test -v ON_ERROR_STOP=1 -f migrations/002_local_auth.sql
      - run: psql -h 127.0.0.1 -U test -d colony_test -v ON_ERROR_STOP=1 -f migrations/003_character_profiles.sql
      - run: psql -h 127.0.0.1 -U test -d colony_test -v ON_ERROR_STOP=1 -f tests/check_schema.sql
      - run: psql -h 127.0.0.1 -U test -d colony_test -v ON_ERROR_STOP=1 -f tests/check_characters_schema.sql
